{{define "content"}}
<h1>{{.Title}}</h1>
{{with .Data}}
<section aria-labelledby="poker-open-title">
  <h2 id="poker-open-title">Abrir ronda</h2>
  <form method="post" action="/planning-poker/abrir">
    <label for="historia">Historia</label>
    <select id="historia" name="historia">
      {{range .Board.Stories}}<option value="{{.ID}}">{{.Title}} ({{.Status}})</option>
      {{end}}
    </select>
    <button type="submit">Abrir ronda</button>
  </form>
</section>

{{range .Board.Rounds}}
<section class="poker-round" data-ronda="{{.ID}}" aria-labelledby="poker-round-{{.ID}}">
  <h2 id="poker-round-{{.ID}}">{{.StoryTitle}}</h2>
  <p>Ronda {{.Number}}</p>
  <ul class="poker-participants">
    {{range .Participants}}<li data-integrante="{{.MemberID}}">{{.Name}}: {{if .HasVoted}}{{$.Data.Voted}}{{else}}{{$.Data.NotVoted}}{{end}}</li>
    {{end}}
  </ul>
</section>
{{end}}
{{end}}
{{end}}
